<main class="flex justify-center px-4 py-10 min-h-[calc(100vh-64px)] md:min-h-[calc(100vh-76px)]">
  <form (ngSubmit)="guardar()" class="w-full max-w-[400px] flex flex-col gap-4">
    <div class="flex flex-col gap-2">
      <h1 class="font-titulo font-medium text-3xl md:text-4xl text-cacao m-0">Cambia tu contraseña</h1>
    </div>

    <div class="bg-fresa/10 border-2 border-fresa rounded-xl p-4">
      <span class="text-fresa font-semibold text-base">
        ⚠ Tu contraseña expiró o fue restablecida. Escribe una contraseña nueva para continuar.
      </span>
    </div>

    @if (errores().length > 0) {
      <div class="bg-fresa/10 border-2 border-fresa rounded-xl p-4 flex flex-col gap-1">
        @for (e of errores(); track e) {
          <span class="text-fresa font-semibold text-base">⚠ {{ e }}</span>
        }
      </div>
    }

    <label class="flex flex-col gap-1.5 text-sm font-medium">
      Contraseña nueva
      <input
        [type]="mostrarPassword() ? 'text' : 'password'"
        name="passwordNueva"
        autocomplete="new-password"
        [ngModel]="passwordNueva()"
        (ngModelChange)="passwordNueva.set($event)"
        class="h-[52px] px-4 rounded-xl border border-borde bg-white text-base font-texto"
      />
      <span class="text-xs text-texto-secundario">Mínimo 8 caracteres, con al menos un número y una mayúscula.</span>
    </label>

    <label class="flex flex-col gap-1.5 text-sm font-medium">
      Repite la contraseña nueva
      <input
        [type]="mostrarPassword() ? 'text' : 'password'"
        name="passwordConfirmar"
        autocomplete="new-password"
        [ngModel]="passwordConfirmar()"
        (ngModelChange)="passwordConfirmar.set($event)"
        class="h-[52px] px-4 rounded-xl border border-borde bg-white text-base font-texto"
      />
    </label>

    <label class="flex items-center gap-2 text-sm">
      <input type="checkbox" name="mostrar" [ngModel]="mostrarPassword()" (ngModelChange)="mostrarPassword.set($event)" />
      Mostrar contraseñas
    </label>

    <button
      type="submit"
      [disabled]="enviando()"
      class="h-[54px] rounded-full bg-fresa text-crema text-base font-semibold border-0 cursor-pointer disabled:opacity-60"
    >
      {{ enviando() ? 'Guardando...' : 'Guardar contraseña nueva' }}
    </button>
  </form>
</main>
